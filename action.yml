name: FocusTrail CI
description: 정적 HTML의 키보드 포커스 순서를 검사하고 기준선과 비교합니다
inputs:
  html:
    description: 검사할 HTML 파일 경로
    required: true
  baseline:
    description: 선택 사항인 FocusTrail JSON 기준선 경로
    required: false
outputs:
  report:
    description: 생성된 보고서 경로
    value: focustrail-current.json
runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/src/cli.mjs" scan "${{ inputs.html }}" --output focustrail-current.json
    - if: inputs.baseline != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/cli.mjs" compare "${{ inputs.baseline }}" focustrail-current.json
