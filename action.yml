name: FocusTrail CI
description: 정적 HTML 키보드 포커스 순서를 검사합니다 / Audit static HTML keyboard focus order
branding:
  icon: navigation
  color: blue
inputs:
  html:
    description: 검사할 HTML 파일 경로 / HTML file to audit
    required: true
  baseline:
    description: FocusTrail JSON 기준선 경로(선택) / Optional baseline path
    required: false
outputs:
  report:
    description: 생성된 보고서 경로 / Generated report path
    value: focustrail-current.json
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_HTML: ${{ inputs.html }}
      run: node "$GITHUB_ACTION_PATH/src/cli.mjs" scan "$INPUT_HTML" --output focustrail-current.json
    - if: inputs.baseline != ''
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
      run: node "$GITHUB_ACTION_PATH/src/cli.mjs" compare "$INPUT_BASELINE" focustrail-current.json
